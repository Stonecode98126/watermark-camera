<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonecode 相機</title>
    <style>
        body { margin: 0; padding: 5px; height: 100vh; display: flex; flex-direction: column; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* 画面占屏幕一半 */
        .photo-frame { flex: 1; min-height: 0; overflow: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        video, #photo { width: 100%; height: 100%; object-fit: cover; }

        /* 控制面板占屏幕另一半 */
        .controls { height: 45vh; display: flex; flex-direction: column; padding: 5px; box-sizing: border-box; }
        .remark-group { margin-bottom: 5px; }
        #remark-input { width: 100%; padding: 8px; border-radius: 8px; border: none; font-size: 14px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 5px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; color: white; }
        #snap-start { background: #22c55e; }
        #snap-end { background: #ef4444; }
        .btn-save { display: block; text-align: center; background: #6366f1; padding: 12px; border-radius: 8px; color: white; text-decoration: none; margin-top: 5px; font-weight: bold; }

        #preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10; display: none; }
    </style>
</head>
<body>

    <div class="photo-frame"><video id="video" autoplay playsinline></video></div>

    <div class="controls">
        <input type="text" id="remark-input" placeholder="工作備註...">
        <div class="btn-group">
            <button id="snap-start">🚀 開始</button>
            <button id="snap-end">🏁 結束</button>
        </div>
        <div id="preview">
            <img id="photo" style="height: 70vh;">
            <a id="downloadBtn" class="btn-save">💾 儲存</a>
            <button onclick="location.reload()" style="background:#444; margin-top:5px;">🔙 重拍</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video'), canvas = document.getElementById('canvas'), photo = document.getElementById('photo'), downloadBtn = document.getElementById('downloadBtn'), remarkInput = document.getElementById('remark-input');
        let currentAddress = "定位中...", latLon = "";

        // 定位
        navigator.geolocation.getCurrentPosition(pos => {
            latLon = `GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
        }, null, { enableHighAccuracy: true });

        // 相机
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

        // 拍照
        function processPhoto(type) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // 水印
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, canvas.height - 200, canvas.width, 200);
            ctx.fillStyle = "#FFD700"; ctx.font = "bold 40px Arial";
            ctx.fillText(remarkInput.value || "無備註", 40, canvas.height - 150);
            ctx.fillStyle = "white"; ctx.font = "30px Arial";
            ctx.fillText(`${type}工作 | ${new Date().toLocaleString()}`, 40, canvas.height - 100);
            ctx.fillText(latLon, 40, canvas.height - 50);

            photo.src = canvas.toDataURL('image/jpeg', 0.7);
            downloadBtn.href = photo.src; downloadBtn.download = `Job_${type}.jpg`;
document.getElementById('preview').style.display = 'block';
        }

        document.getElementById('snap-start').onclick = () => processPhoto("開始");
        document.getElementById('snap-end').onclick = () => processPhoto("結束");
    </script>
</body>
</html>
