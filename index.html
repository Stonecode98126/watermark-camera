<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonecode 專業地理浮水印相機</title>
    <style>
        /* 基礎樣式與外框 */
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .creator-badge { position: absolute; top: 15px; right: 15px; background: #000; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; z-index: 100; }
        .photo-frame { width: 100%; max-width: 500px; background: #fff; padding: 10px 10px 25px 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        video, #photo { width: 100%; border-radius: 8px; display: block; background: #000; }
        
        /* 按鈕設計 */
        .controls { width: 100%; max-width: 500px; }
        button, .btn-link { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; }
        .btn-snap { background: #007aff; color: white; }
        .btn-save { background: #ff9500; color: white; }
        
        /* 瀏覽器引導層 (覆蓋全螢幕) */
        #browser-guide {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 999;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px;
        }
        .guide-arrow { position: absolute; top: 10px; right: 20px; font-size: 40px; }

        .status { font-size: 14px; color: #555; margin: 10px 0; text-align: center; }
    </style>
</head>
<body>

    <div class="creator-badge">Created by Stonecode</div>

    <div id="browser-guide">
        <div class="guide-arrow">↗️</div>
        <h2>請使用 Chrome 開啟</h2>
        <p>偵測到您正在使用應用程式內建瀏覽器 (如 LINE/FB)，這會導致相機與 GPS 無法運作。</p>
        <p>請點擊右上角或右下角 <b>「...」</b><br>選擇 <b>「在瀏覽器中開啟」</b></p>
    </div>

    <h2 style="margin-top: 40px;">自動定位打卡相機</h2>
    <h2 style="margin-top: ２0px;">請等待定位完成</h2>
    <div id="status" class="status">正在檢查環境...</div>

    <div class="photo-frame">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="snap" class="btn-snap">📸 拍照並合成</button>
        <div id="preview" style="display:none; margin-top: 15px;">
            <div class="photo-frame"><img id="photo"></div>
            <a id="downloadBtn" class="btn-save" download="Stonecode_CheckIn.jpg">💾 儲存這張照片</a>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const snapBtn = document.getElementById('snap');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const guide = document.getElementById('browser-guide');

        let currentAddress = "定位搜尋中...";
        let latLon = "";

        // 1. 環境檢測：若在 LINE/FB 內建瀏覽器，顯示引導
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isAppBrowser = (ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
        
        if (isAppBrowser) {
            guide.style.display = 'flex';
        }

        // 2. 取得 GPS 與 地址 (OpenStreetMap)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                latLon = `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
                    const data = await res.json();
                    currentAddress = data.display_name.split(',').reverse().join(' ').trim(); // 簡單重排格式
                    statusDiv.innerText = `📍 定位：${currentAddress}`;
                } catch (e) {
                    currentAddress = "地址解析暫時不可用";
                    statusDiv.innerText = "📍 定位成功 " + latLon;
                }
            }, () => {
                statusDiv.innerText = "❌ 請允許 GPS 定位權限";
            }, { enableHighAccuracy: true });
        }

        // 3. 啟動相機
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(() => { statusDiv.innerText = "❌ 無法取得相機，請檢查權限或使用 Chrome"; });

        // 4. 拍照繪圖
        snapBtn.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' }).replace(/\//g, '-');
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });

            // 計算字體
            const base = canvas.width * 0.04;
            const bigFont = base * 2.5; // 日期時間放大
            const smallFont = base * 0.8; // 地址

            // 繪製黑色漸層底色
            const grad = ctx.createLinearGradient(0, canvas.height - (base * 6), 0, canvas.height);
            grad.addColorStop(0, "transparent");
            grad.addColorStop(1, "rgba(0,0,0,0.8)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, canvas.height - (base * 6), canvas.width, base * 6);

            // 寫入文字
            ctx.fillStyle = "white";
            ctx.font = `bold ${bigFont}px sans-serif`;
            ctx.fillText(`${dateStr} ${timeStr}`, 20, canvas.height - (base * 3));

            ctx.font = `${smallFont}px sans-serif`;
            ctx.fillText(`📍 ${currentAddress}`, 22, canvas.height - (base * 1.5));
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fillText(latLon, 22, canvas.height - (base * 0.5));

            // 預覽與下載
            const imgUrl = canvas.toDataURL('image/jpeg', 0.9);
            photo.src = imgUrl;
            downloadBtn.href = imgUrl;
            document.getElementById('preview').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>
</body>
</html>
