<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonecode 高質感地址浮水印相機</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; background: #f8f9fa; margin: 0; min-height: 100vh;
        }
        .creator-badge {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
            z-index: 100;
        }
        .photo-frame {
            width: 100%; max-width: 600px; background: #fff;
            padding: 12px 12px 25px 12px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); box-sizing: border-box; margin-bottom: 20px;
        }
        video { width: 100%; border-radius: 6px; background: #000; display: block; }
        .controls { width: 100%; max-width: 600px; }
        button { 
            width: 100%; padding: 18px; margin: 10px 0; font-size: 18px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 10px; transition: 0.2s;
        }
        .btn-snap { background: #007aff; color: white; }
        .btn-save { background: #ff9500; color: white; text-decoration: none; display: block; text-align: center; line-height: 20px; box-sizing: border-box;}
        #preview { display: none; margin-top: 15px; }
        #photo { width: 100%; border-radius: 6px; }
        .status { color: #666; font-size: 14px; margin: 10px 0; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="creator-badge">Created by Stonecode</div>

    <h2 style="margin-bottom: 10px;">地址浮水印相機</h2>
    <div id="status" class="status">正在初始化相機與地址搜尋...</div>

    <div class="photo-frame">
        <video id="video" autoplay playsinline></video>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="snap" class="btn-snap">📸 拍照 (地址/大字體時間)</button>
        
        <div id="preview">
            <div class="photo-frame">
                <img id="photo">
            </div>
            <a id="downloadBtn" class="btn-save" download="Stonecode_Photo.jpg">💾 儲存這張照片</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const snapBtn = document.getElementById('snap');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewDiv = document.getElementById('preview');
        const statusDiv = document.getElementById('status');
        
        let currentAddress = "取得地址中...";
        let latLonInfo = "";

        // 1. 取得 GPS 並透過 OpenStreetMap 轉換地址
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                latLonInfo = `(GPS: ${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                
                try {
                    // 呼叫 OpenStreetMap Nominatim API
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
                    const data = await response.json();
                    currentAddress = data.display_name || "未知地點";
                    statusDiv.innerText = `📍 目前位置：${currentAddress}`;
                } catch (error) {
                    currentAddress = "地址解析失敗";
                    statusDiv.innerText = `📍 定位成功，但地址解析失敗 ${latLonInfo}`;
                }
            }, (err) => {
                currentAddress = "未開啟 GPS 定位";
                statusDiv.innerText = "⚠️ 請開啟 GPS 以顯示地址";
            }, { enableHighAccuracy: true });
        }

        // 2. 啟動鏡頭
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusDiv.innerText = "無法啟動相機"; });

        // 3. 繪製浮水印
        snapBtn.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 畫出原始影像
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour12: false });

            // 設定基礎比例
            const baseUnit = canvas.width * 0.03; 
            const bigFontSize = baseUnit * 3; // 時間放大三倍
            const smallFontSize = baseUnit * 1.2; // 地址與座標字體

            // 繪製背景遮罩
            const maskHeight = (bigFontSize + (smallFontSize * 3)) + 40;
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, canvas.height - maskHeight, canvas.width, maskHeight);

            ctx.fillStyle = "white";
            ctx.textBaseline = "top";
            
            // 繪製時間 (放大 3 倍)
            ctx.font = `bold ${bigFontSize}px sans-serif`;
            ctx.fillText(`${dateStr} ${timeStr}`, 20, canvas.height - maskHeight + 10);

            // 繪製地址
            ctx.font = `${smallFontSize}px sans-serif`;
            // 地址可能很長，簡單截斷或分行
            const displayAddr = currentAddress.length > 30 ? currentAddress.substring(0, 30) + "..." : currentAddress;
            ctx.fillText(`📍 ${displayAddr}`, 20, canvas.height - maskHeight + bigFontSize + 15);
            
            // 繪製微型座標 (專業感)
            ctx.font = `${smallFontSize * 0.8}px monospace`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.fillText(latLonInfo, 20, canvas.height - 30);

            // 輸出結果
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            photo.src = dataUrl;
            downloadBtn.href = dataUrl;
            previewDiv.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>
</body>
</html>
