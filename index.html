<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作定位相機 (修正 Exif 版)</title>
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <style>
        /* 保持原本的 CSS 樣式，此處省略以節省空間，請沿用你原本檔內的 style */
        * { box-sizing: border-box; }
        body { display: flex; flex-direction: column; padding: 8px; font-family: sans-serif; height: 100vh; margin: 0; background: #f0f2f5; }
        #video { width: 100%; flex: 1; background: #000; border-radius: 10px; object-fit: cover; border: 3px solid #28a745; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        #snap-start { background: #28a745; }
        #snap-end { background: #dc3545; }
        .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.9); flex-direction: column; padding: 20px; z-index: 1000; }
        .modal.active { display: flex; }
        #photo { max-width: 100%; max-height: 70vh; object-fit: contain; margin: auto; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 8px; text-align: center; color: white; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
        .btn-close { background: #666; }
        .btn-save { background: #ff9500; }
    </style>
</head>
<body>
    <div id="status">📍 正在獲取位置...</div>
    <video id="video" autoplay playsinline muted></video>
    <div class="btn-group">
        <button id="snap-start" class="action-btn">🚀 開始工作</button>
        <button id="snap-end" class="action-btn">🏁 結束工作</button>
    </div>

    <div id="preview-modal" class="modal">
        <img id="photo">
        <div class="modal-btns">
            <button class="modal-btn btn-close" onclick="document.getElementById('preview-modal').classList.remove('active')">關閉</button>
            <a id="downloadBtn" class="modal-btn btn-save">💾 儲存照片</a>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        
        let currentLat = null;
        let currentLon = null;
        let currentAddress = "未知地點";

        // 1. 定位獲取
        navigator.geolocation.watchPosition(pos => {
            currentLat = pos.coords.latitude;
            currentLon = pos.coords.longitude;
            statusDiv.innerText = `📍 GPS: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}`;
        }, null, { enableHighAccuracy: true });

        // 2. 啟動相機
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => video.srcObject = stream);

        // --- 關鍵修正：手動將十進位轉為 EXIF Rational 格式 ---
        function decimalToExifRational(decimal) {
            const deg = Math.floor(Math.abs(decimal));
            const minFloat = (Math.abs(decimal) - deg) * 60;
            const min = Math.floor(minFloat);
            const sec = Math.round((minFloat - min) * 60 * 100);
            // 格式：[[度, 1], [分, 1], [秒*100, 100]]
            return [[deg, 1], [min, 1], [sec, 100]];
        }

        async function processPhoto(action) {
            if (!video.videoWidth) return;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            // 繪製簡易浮水印
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.fillText(`${new Date().toLocaleString()} | ${action}`, 20, canvas.height - 40);

            const base64 = canvas.toDataURL('image/jpeg', 0.9);
            
            // --- Exif 寫入邏輯修正 ---
            let finalImgUrl = base64;
            try {
                const now = new Date();
                const dateStr = now.getFullYear() + ":" + ("0"+(now.getMonth()+1)).slice(-2) + ":" + ("0"+now.getDate()).slice(-2) + " " + ("0"+now.getHours()).slice(-2) + ":" + ("0"+now.getMinutes()).slice(-2) + ":" + ("0"+now.getSeconds()).slice(-2);

                const exifObj = {
                    "0th": {
                        [piexif.ImageIFD.Software]: "Stonecode WorkCam",
                        [piexif.ImageIFD.DateTime]: dateStr
                    },
                    "Exif": {
                        [piexif.ExifIFD.DateTimeOriginal]: dateStr,
                        [piexif.ExifIFD.DateTimeDigitized]: dateStr
                    },
                    "GPS": {
                        // 修正 1: 必須包含 GPSVersionID (2.2.0.0 為 [2, 2, 0, 0])
                        [piexif.GPSIFD.GPSVersionID]: [2, 2, 0, 0]
                    }
                };

                if (currentLat !== null && currentLon !== null) {
                    // 修正 2: 手動轉換經緯度格式
                    exifObj["GPS"][piexif.GPSIFD.GPSLatitudeRef] = currentLat >= 0 ? "N" : "S";
                    exifObj["GPS"][piexif.GPSIFD.GPSLatitude] = decimalToExifRational(currentLat);
                    exifObj["GPS"][piexif.GPSIFD.GPSLongitudeRef] = currentLon >= 0 ? "E" : "W";
                    exifObj["GPS"][piexif.GPSIFD.GPSLongitude] = decimalToExifRational(currentLon);
                }

                const exifBytes = piexif.dump(exifObj);
                finalImgUrl = piexif.insert(exifBytes, base64);
            } catch (e) {
                console.error("Exif 寫入失敗:", e);
            }

            photo.src = finalImgUrl;
            downloadBtn.href = finalImgUrl;
            downloadBtn.download = `Work_${Date.now()}.jpg`;
            document.getElementById('preview-modal').classList.add('active');
        }

        document.getElementById('snap-start').addEventListener('click', () => processPhoto("開始工作"));
        document.getElementById('snap-end').addEventListener('click', () => processPhoto("結束工作"));
    </script>
</body>
</html>
