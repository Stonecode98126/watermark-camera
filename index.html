<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iPhone 定位測試</title>
    <style>
        :root {
            --bg: #0f1418;
            --panel: #1a2127;
            --line: #2b353d;
            --ink: #e8eef2;
            --muted: #8a99a5;
            --accent: #3ea6ff;
            --ok: #34c77b;
            --warn: #e6a23c;
            --err: #f56c6c;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
            line-height: 1.55;
            max-width: 560px;
            margin-inline: auto;
        }
        h1 {
            font-size: 19px;
            font-weight: 600;
            margin: 4px 0 2px;
            letter-spacing: .3px;
        }
        .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

        /* 安全環境橫幅 */
        .banner {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 12px 14px; border-radius: 12px;
            font-size: 13px; margin-bottom: 16px;
            border: 1px solid var(--line);
        }
        .banner.ok   { background: rgba(52,199,123,.08); border-color: rgba(52,199,123,.35); color: #a9e9c6; }
        .banner.warn { background: rgba(230,162,60,.09); border-color: rgba(230,162,60,.4);  color: #f0d19a; }
        .banner .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
        .banner.ok   .dot { background: var(--ok); }
        .banner.warn .dot { background: var(--warn); }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
        button {
            font: inherit; font-weight: 600; font-size: 16px;
            color: #04121e; background: var(--accent);
            border: 0; border-radius: 14px;
            padding: 15px 18px; cursor: pointer;
            transition: transform .08s ease, opacity .15s ease;
            touch-action: manipulation;
        }
        button:active { transform: scale(.98); }
        button:disabled { opacity: .5; cursor: default; }
        button.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }

        .toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 16px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px;
            font-size: 14px; color: var(--ink);
        }
        .toggle input { width: 44px; height: 26px; accent-color: var(--accent); }

        /* 狀態列 */
        .status {
            display: flex; align-items: center; gap: 9px;
            font-size: 14px; color: var(--muted);
            padding: 12px 4px; min-height: 22px;
        }
        .spinner {
            width: 15px; height: 15px; border-radius: 50%;
            border: 2px solid var(--line); border-top-color: var(--accent);
            animation: spin .8s linear infinite; flex: 0 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status.err  { color: #f2a6a6; }
        .status.done { color: var(--ok); }

        /* 結果卡 */
        .card {
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 16px; overflow: hidden;
            opacity: 0; max-height: 0; transition: opacity .25s ease;
        }
        .card.show { opacity: 1; max-height: none; }
        .row {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line);
        }
        .row:last-child { border-bottom: 0; }
        .row .k { color: var(--muted); font-size: 13px; flex: 0 0 auto; }
        .row .v { font-family: var(--mono); font-size: 15px; text-align: right; word-break: break-all; }
        .row .v.big { font-size: 17px; }
        .accuracy-good { color: var(--ok); }
        .accuracy-mid  { color: var(--warn); }
        .accuracy-bad  { color: #f2a6a6; }

        .card-actions { display: flex; gap: 10px; padding: 14px 16px; }
        .card-actions a, .card-actions button {
            flex: 1; text-align: center; text-decoration: none;
            font-size: 14px; padding: 12px; border-radius: 12px;
        }
        .card-actions a {
            background: transparent; color: var(--accent);
            border: 1px solid var(--line); font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .hint { color: var(--muted); font-size: 12px; margin-top: 16px; }
        .hint code { background: var(--panel); padding: 1px 6px; border-radius: 5px; font-size: 11px; }
    </style>
</head>
<body>
    <h1>iPhone 網頁定位測試</h1>
    <p class="sub">高精準度 GPS 定位 · 支援即時追蹤</p>

    <!-- 安全環境提示（HTTPS 檢查） -->
    <div id="secBanner" class="banner" hidden>
        <span class="dot"></span>
        <span id="secText"></span>
    </div>

    <div class="controls">
        <button id="btnLocate" onclick="getLocation()">取得我的位置</button>
        <label class="toggle">
            <span>持續追蹤（移動時自動更新）</span>
            <input type="checkbox" id="watchToggle" onchange="toggleWatch()">
        </label>
    </div>

    <div id="status" class="status">點擊上方按鈕開始定位…</div>

    <div id="card" class="card">
        <div class="row"><span class="k">緯度 Latitude</span><span class="v big" id="lat">—</span></div>
        <div class="row"><span class="k">經度 Longitude</span><span class="v big" id="lng">—</span></div>
        <div class="row"><span class="k">準確率</span><span class="v" id="acc">—</span></div>
        <div class="row"><span class="k">海拔高度</span><span class="v" id="alt">—</span></div>
        <div class="row"><span class="k">移動速度</span><span class="v" id="spd">—</span></div>
        <div class="row"><span class="k">取得時間</span><span class="v" id="time">—</span></div>
        <div class="card-actions">
            <a id="mapLink" href="#" target="_blank" rel="noopener">在地圖開啟</a>
            <button class="ghost" onclick="copyCoords()" id="copyBtn">複製座標</button>
        </div>
    </div>

    <p class="hint">
        提示：iPhone 只在 <code>https://</code> 網頁允許定位。若用 <code>file://</code> 直接開檔會失敗，
        請上傳到 Netlify / GitHub Pages 等 HTTPS 空間再測試。
    </p>

    <script>
    // ── 定位參數（對 iPhone GPS 特別重要）──────────────
    const options = {
        enableHighAccuracy: true, // 強制使用 GPS 精準定位，而非基地台模糊定位
        timeout: 15000,           // 逾時時間：15 秒（iPhone 首次抓 GPS 可能較久）
        maximumAge: 0             // 每次都抓最新位置，不使用快取
    };

    let watchId = null;      // 持續追蹤的 handle
    let lastCoords = null;   // 給「複製座標」用

    // ── 啟動時：檢查是否在安全環境（HTTPS）─────────────
    (function checkSecureContext() {
        const banner = document.getElementById("secBanner");
        const text = document.getElementById("secText");
        if (!navigator.geolocation) {
            banner.hidden = false; banner.className = "banner warn";
            text.textContent = "您的瀏覽器不支援定位功能。";
            document.getElementById("btnLocate").disabled = true;
            return;
        }
        if (window.isSecureContext) {
            banner.hidden = false; banner.className = "banner ok";
            text.textContent = "環境正常（HTTPS），可正常請求定位。";
        } else {
            banner.hidden = false; banner.className = "banner warn";
            text.textContent = "目前不是安全環境（非 HTTPS）。iPhone 可能會拒絕定位，請改用 HTTPS 網址開啟。";
        }
    })();

    // ── 單次定位 ─────────────────────────────────────
    function getLocation() {
        if (!navigator.geolocation) {
            setStatus("您的瀏覽器不支援定位功能。", "err");
            return;
        }
        setStatus("正在請求定位權限並計算位置…", "loading");
        navigator.geolocation.getCurrentPosition(success, error, options);
    }

    // ── 持續追蹤切換 ─────────────────────────────────
    function toggleWatch() {
        const on = document.getElementById("watchToggle").checked;
        if (on) {
            if (!navigator.geolocation) {
                setStatus("您的瀏覽器不支援定位功能。", "err");
                document.getElementById("watchToggle").checked = false;
                return;
            }
            setStatus("持續追蹤中…移動時會自動更新", "loading");
            watchId = navigator.geolocation.watchPosition(success, error, options);
        } else {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            setStatus("已停止持續追蹤。", "done");
        }
    }

    // ── 成功取得定位 ─────────────────────────────────
    function success(position) {
        const c = position.coords;
        lastCoords = { lat: c.latitude, lng: c.longitude };

        document.getElementById("lat").textContent = c.latitude.toFixed(6);
        document.getElementById("lng").textContent = c.longitude.toFixed(6);

        // 準確率上色：越小越好
        const accEl = document.getElementById("acc");
        const a = c.accuracy;
        accEl.textContent = "方圓 " + a.toFixed(1) + " 公尺內";
        accEl.className = "v " + (a <= 20 ? "accuracy-good" : a <= 100 ? "accuracy-mid" : "accuracy-bad");

        document.getElementById("alt").textContent =
            (c.altitude != null && !isNaN(c.altitude)) ? c.altitude.toFixed(1) + " 公尺" : "無資料";
        document.getElementById("spd").textContent =
            (c.speed != null && !isNaN(c.speed)) ? (c.speed * 3.6).toFixed(1) + " km/h" : "無資料";
        document.getElementById("time").textContent =
            new Date(position.timestamp).toLocaleTimeString("zh-TW");

        document.getElementById("mapLink").href =
            `https://www.google.com/maps?q=${c.latitude},${c.longitude}`;

        document.getElementById("card").classList.add("show");

        const watching = document.getElementById("watchToggle").checked;
        setStatus(watching ? "持續追蹤中…座標已更新" : "定位成功！",
                  watching ? "loading" : "done");
    }

    // ── 定位失敗 ─────────────────────────────────────
    function error(err) {
        let msg;
        switch (err.code) {
            case err.PERMISSION_DENIED:
                msg = "使用者拒絕了定位請求。請到 iPhone「設定 → Safari → 位置」與網站權限中開啟。";
                break;
            case err.POSITION_UNAVAILABLE:
                msg = "無法取得位置資訊（可能 GPS 訊號太弱，建議移到戶外或窗邊）。";
                break;
            case err.TIMEOUT:
                msg = "定位要求逾時，請再試一次。";
                break;
            default:
                msg = "發生未知錯誤：" + err.message;
        }
        setStatus(msg, "err");
    }

    // ── 複製座標 ─────────────────────────────────────
    function copyCoords() {
        if (!lastCoords) return;
        const txt = `${lastCoords.lat.toFixed(6)}, ${lastCoords.lng.toFixed(6)}`;
        const btn = document.getElementById("copyBtn");
        const done = () => { btn.textContent = "已複製 ✓"; setTimeout(() => btn.textContent = "複製座標", 1500); };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(done).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }
        function fallbackCopy() {
            const t = document.createElement("textarea");
            t.value = txt; t.style.position = "fixed"; t.style.opacity = "0";
            document.body.appendChild(t); t.focus(); t.select();
            try { document.execCommand("copy"); done(); } catch (e) {}
            document.body.removeChild(t);
        }
    }

    // ── 狀態列 helper ────────────────────────────────
    function setStatus(text, type) {
        const el = document.getElementById("status");
        el.className = "status" + (type === "err" ? " err" : type === "done" ? " done" : "");
        el.innerHTML = (type === "loading" ? '<span class="spinner"></span>' : "") +
                       `<span>${text}</span>`;
    }
    </script>
</body>
</html>
