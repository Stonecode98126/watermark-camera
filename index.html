<div class="photo-frame">
                <img id="photo">
            </div>
            <a id="downloadBtn" class="btn-save">💾 儲存照片</a>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video'), canvas = document.getElementById('canvas'), photo = document.getElementById('photo'), downloadBtn = document.getElementById('downloadBtn'), statusDiv = document.getElementById('status'), remarkInput = document.getElementById('remark-input');
        let currentAddress = "定位中...", latLon = "";

        // 1. 定位
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                latLon = `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
                    const data = await res.json();
                    currentAddress = data.display_name.split(',').reverse().join(' ').trim();
                    statusDiv.innerText = `📍 ${currentAddress}`;
                } catch (e) { statusDiv.innerText = `📍 ${latLon}`; }
            }, () => statusDiv.innerText = "❌ 無法取得定位", { enableHighAccuracy: true });
        }

        // 2. 相機
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => video.srcObject = stream).catch(() => statusDiv.innerText = "❌ 相機無法使用");

        // 3. 核心處理
        function processPhoto(type) {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const now = new Date(), dateStr = now.toLocaleDateString().replace(/\//g, '-'), timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            const base = canvas.width * 0.03;
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(0, canvas.height - base * 10, canvas.width, base * 10);

            ctx.fillStyle = "#FFD700"; ctx.font = `bold ${base * 1.5}px Inter`;
            ctx.fillText(remarkInput.value || "無備註", 30, canvas.height - base * 7.5);
            
            ctx.fillStyle = (type === "開始") ? "#22c55e" : "#ef4444";
            ctx.fillText(`【${type}工作】 ${dateStr} ${timeStr}`, 30, canvas.height - base * 5.0);

            ctx.fillStyle = "white"; ctx.font = `${base * 1.2}px Inter`;
            ctx.fillText(`📍 ${currentAddress.substring(0, 40)}`, 30, canvas.height - base * 2.5);
            ctx.fillText(latLon, 30, canvas.height - base * 1.0);

            const imgUrl = canvas.toDataURL('image/jpeg', 0.8);
            photo.src = imgUrl; downloadBtn.href = imgUrl; downloadBtn.download = `Job_${type}_${dateStr}.jpg`;
            document.getElementById('preview').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        document.getElementById('snap-start').onclick = () => processPhoto("開始");
        document.getElementById('snap-end').onclick = () => processPhoto("結束");
    </script>
</body>
</html>
