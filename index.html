<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonecode 輕量定位相機 - 行程紀錄版</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; padding-bottom: 50px; }
        .creator-badge { position: absolute; top: 15px; right: 15px; background: #000; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; z-index: 100; }
        .photo-frame { width: 100%; max-width: 500px; background: #fff; padding: 10px 10px 25px 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        video, #photo { width: 100%; border-radius: 8px; display: block; background: #000; }
        .controls { width: 100%; max-width: 500px; }
        button, .btn-link { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; display: block; text-align: center; box-sizing: border-box; transition: 0.1; }
        button:active { transform: scale(0.98); }
        /* 出發按鈕顏色 */
        .btn-start { background: #007aff; color: white; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        /* 抵達按鈕顏色 */
        .btn-end { background: #34c759; color: white; box-shadow: 0 4px 10px rgba(52,199,89,0.3); }
        .btn-save { background: #ff9500; color: white; box-shadow: 0 4px 10px rgba(255,149,0,0.3); }
        #browser-guide { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
        .guide-arrow { position: absolute; top: 10px; right: 20px; font-size: 40px; }
        .status { font-size: 14px; color: #555; margin: 10px 0; text-align: center; line-height: 1.5; }
        #file-info { font-size: 12px; color: #888; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <div class="creator-badge">Created by Stonecode</div>

    <div id="browser-guide">
        <div class="guide-arrow">↗️</div>
        <h2>請使用 Chrome 開啟</h2>
        <p>偵測到您正在使用應用程式內建瀏覽器 (如 LINE/FB)，這會導致相機與 GPS 無法運作。</p>
        <p>請點擊右上角 <b>「...」</b><br>選擇 <b>「在瀏覽器中開啟」</b></p>
    </div>

    <h2 style="margin-top: 40px; margin-bottom: 5px;">行程定位相機</h2>
    <div id="status" class="status">正在檢查環境與定位...</div>

    <div class="photo-frame">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="btnStart" class="btn-start">🚗 出發拍照</button>
        <button id="btnEnd" class="btn-end">🏁 抵達拍照</button>

        <div id="preview" style="display:none; margin-top: 15px;">
            <h3 style="text-align:center; color:#333;">照片預覽 (<span id="previewMode"></span>)：</h3>
            <div class="photo-frame">
                <img id="photo">
                <div id="file-info"></div>
            </div>
            <a id="downloadBtn" class="btn-save" download="Stonecode_Trip.jpg">💾 儲存照片</a>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const fileInfoDiv = document.getElementById('file-info');
        const guide = document.getElementById('browser-guide');
        const previewMode = document.getElementById('previewMode');

        let currentAddress = "定位搜尋中...";
        let latLon = "";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isAppBrowser = (ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);
        if (isAppBrowser) { guide.style.display = 'flex'; }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                latLon = `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
                    const data = await res.json();
                    currentAddress = data.display_name.split(',').reverse().join(' ').trim();
                    statusDiv.innerText = `📍 定位：${currentAddress}`;
                } catch (e) {
                    currentAddress = "地址解析暫時不可用";
                    statusDiv.innerText = "📍 定位成功 " + latLon;
                }
            }, () => {
                statusDiv.innerText = "❌ 請允許 GPS 定位權限";
            }, { enableHighAccuracy: true });
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(() => { statusDiv.innerText = "❌ 無法取得相機，請檢查權限"; });

        function getBase64Size(base64String) {
            const stringLength = base64String.length - 'data:image/jpeg;base64,'.length;
            const sizeInBytes = 4 * Math.ceil(stringLength / 3) * 0.5624896334383812;
            return (sizeInBytes / 1024).toFixed(0) + " KB";
        }

        // 修改處：統一拍照函式，傳入模式標籤
        function takePhoto(modeLabel) {
            const ctx = canvas.getContext('2d');
            const MAX_WIDTH = 1280;
            let targetWidth = video.videoWidth;
            let targetHeight = video.videoHeight;

            if (targetWidth > MAX_WIDTH) {
                targetHeight = Math.round(targetHeight * (MAX_WIDTH / targetWidth));
                targetWidth = MAX_WIDTH;
            }

            canvas.width = targetWidth;
            canvas.height = targetHeight;
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' }).replace(/\//g, '-');
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            
            const base = canvas.width * 0.03;
            const bigFont = base * 2.8; 
            const smallFont = base * 1.1;

            const gradHeight = base * 7;
            const gradY = canvas.height - gradHeight;
            const grad = ctx.createLinearGradient(0, gradY, 0, canvas.height);
            grad.addColorStop(0, "transparent");
            grad.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, gradY, canvas.width, gradHeight);

            ctx.fillStyle = "white";
            ctx.textBaseline = "alphabetic";

            // 修改處：浮水印增加 [出發] 或 [抵達] 標籤
            ctx.font = `bold ${bigFont}px sans-serif`;
            ctx.fillText(`[${modeLabel}] ${dateStr} ${timeStr}`, 25, gradY + (base * 3.5));

            ctx.font = `${smallFont}px sans-serif`;
            const addrToDisplay = currentAddress.length > 40 ? currentAddress.substring(0, 40) + "..." : currentAddress;
            ctx.fillText(`📍 ${addrToDisplay}`, 27, gradY + (base * 5.2));

            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.font = `${smallFont * 0.9}px monospace`;
            ctx.fillText(latLon, 27, gradY + (base * 6.4));

            const imgUrl = canvas.toDataURL('image/jpeg', 0.6);
            photo.src = imgUrl;
            downloadBtn.href = imgUrl;
            downloadBtn.download = `Stonecode_${modeLabel}_${dateStr}.jpg`;
            
            previewMode.innerText = modeLabel;
            fileInfoDiv.innerText = `[ ${modeLabel}照片已最佳化：${targetWidth}x${targetHeight} | 預估大小: ${getBase64Size(imgUrl)} ]`;

            document.getElementById('preview').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // 綁定事件
        document.getElementById('btnStart').addEventListener('click', () => takePhoto('出發'));
        document.getElementById('btnEnd').addEventListener('click', () => takePhoto('抵達'));
    </script>
</body>
</html>
