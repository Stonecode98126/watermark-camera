<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonecode 地理浮水印相機</title>
    <style>
        body { margin: 0; padding: 5px; height: 100vh; display: flex; flex-direction: column; background: #f0f2f5; font-family: sans-serif; overflow: hidden; }
        .creator-badge { position: absolute; top: 10px; right: 10px; background: #000; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 10px; z-index: 100; }
        
        .photo-frame { flex: 0 0 45vh; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video, #photo { width: 100%; height: 100%; object-fit: cover; }

        .controls { flex: 1; display: flex; flex-direction: column; padding: 5px; box-sizing: border-box; overflow-y: auto; }
        .remark-group { margin-bottom: 5px; }
        #remark-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 5px; margin-top: 5px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; color: white; cursor: pointer; }
        #snap-start { background: #28a745; }
        #snap-end { background: #dc3545; }
        .btn-save { display: block; text-align: center; background: #ff9500; padding: 12px; border-radius: 5px; color: white; text-decoration: none; margin-top: 5px; font-weight: bold; }

        #browser-guide { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .status { font-size: 12px; color: #555; text-align: center; margin: 5px 0; }
        #file-info { font-size: 11px; color: #888; text-align: center; }
        #preview { display: none; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="creator-badge">Stonecode</div>
    <div id="browser-guide"><h2>請使用 Chrome 開啟</h2></div>

    <div id="status" class="status">正在檢查定位...</div>
    <div class="photo-frame"><video id="video" autoplay playsinline></video></div>

    <div class="controls">
        <input type="text" id="remark-input" placeholder="工作備註...">
        <div class="btn-group">
            <button id="snap-start">🚀 開始工作</button>
            <button id="snap-end">🏁 結束工作</button>
        </div>
        <div id="preview">
            <img id="photo" style="width: 100%;">
            <div id="file-info"></div>
            <a id="downloadBtn" class="btn-save">💾 儲存輕量化照片</a>
            <button onclick="location.reload()" style="background:#666; width:100%; margin-top:5px;">🔙 重拍</button>
        </div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video'), canvas = document.getElementById('canvas'), photo = document.getElementById('photo'), downloadBtn = document.getElementById('downloadBtn'), statusDiv = document.getElementById('status'), remarkInput = document.getElementById('remark-input'), fileInfoDiv = document.getElementById('file-info');
        let currentAddress = "定位搜尋中...", latLon = "";

        // 1. 環境檢測與定位
        const isAppBrowser = /Line|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
        if (isAppBrowser) document.getElementById('browser-guide').style.display = 'flex';
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude, lon = pos.coords.longitude;
            latLon = `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
const data = await res.json();
                currentAddress = data.display_name.split(',').reverse().join(' ').trim();
                statusDiv.innerText = `📍 ${currentAddress}`;
            } catch(e) { statusDiv.innerText = `📍 定位成功 ${latLon}`; }
        }, () => statusDiv.innerText = "❌ 無定位權限", { enableHighAccuracy: true });

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

        // 2. 繪圖核心 (保留你原本複雜的繪製邏輯)
        function processPhoto(type) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const now = new Date(), dateStr = now.toLocaleDateString('zh-TW').replace(/\//g, '-'), timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            const base = canvas.width * 0.03, remark = remarkInput.value.trim();
            const gradHeight = (remark ? base * 1.8 : 0) + base * 8;
            
            ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, canvas.height - gradHeight, canvas.width, gradHeight);
            
            if(remark) {
                ctx.fillStyle = "#FFD700"; ctx.font = `bold ${base * 1.3}px sans-serif`;
                ctx.fillText(`📝 ${remark.substring(0,38)}`, 25, canvas.height - gradHeight + base * 1.5);
            }
            
            ctx.fillStyle = (type === "開始") ? "#28a745" : "#dc3545";
            ctx.font = `bold ${base * 1.6}px sans-serif`;
            ctx.fillText(`【${type}工作】`, 25, canvas.height - gradHeight + (remark ? base*3.5 : base*2.5));
            
            ctx.fillStyle = "white"; ctx.font = `bold ${base * 2.5}px sans-serif`;
            ctx.fillText(`${dateStr} ${timeStr}`, 25, canvas.height - gradHeight + (remark ? base*6.5 : base*5.5));
            
            ctx.font = `${base * 1.1}px sans-serif`;
            ctx.fillText(`📍 ${currentAddress.substring(0,40)}`, 27, canvas.height - gradHeight + (remark ? base*7.8 : base*6.8));
            
            const imgUrl = canvas.toDataURL('image/jpeg', 0.6);
            photo.src = imgUrl; downloadBtn.href = imgUrl; downloadBtn.download = `Job_${type}.jpg`;
            fileInfoDiv.innerText = `紀錄已生成 | ${(imgUrl.length*0.75/1024).toFixed(0)} KB`;
            document.getElementById('preview').style.display = 'block';
        }

        document.getElementById('snap-start').onclick = () => processPhoto("開始");
        document.getElementById('snap-end').onclick = () => processPhoto("結束");
    </script>
</body>
</html>
